<svg xmlns="http://www.w3.org/2000/svg" width="56" height="68" viewBox="0 0 56 68" fill="none" role="img" aria-label="SpaceLine mark">
  <style>
    path {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform .45s cubic-bezier(.16, 1, .3, 1), fill-opacity .35s ease;
    }
    svg:hover .plane-top { transform: translateY(-2.5px); }
    svg:hover .plane-mid { fill-opacity: .85; }
    svg:hover .plane-bot { transform: translateY(2.5px); }
    @media (prefers-reduced-motion: reduce) {
      path { transition: none; }
      svg:hover .plane-top, svg:hover .plane-bot { transform: none; }
    }
  </style>
