name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pyinstaller>=6.15"

      - name: Check Python and authentication JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q app run.py
          node --check static/auth.js

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean Spaceline.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup installer
        shell: pwsh
        run: |
          $version = (Select-String -Path "app/version.py" -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read app version." }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\Spaceline.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spaceline-Windows-Installer
          path: installer_output/Spaceline-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Spaceline ${{ github.ref_name }}
          generate_release_notes: true
          files: installer_output/Spaceline-Setup-*.exe